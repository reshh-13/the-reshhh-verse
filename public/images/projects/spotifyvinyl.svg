<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vinylBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c1d"/>
      <stop offset="100%" stop-color="#1f1430"/>
    </linearGradient>

    <pattern id="purpleHalftoneVinyl" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="#6536D9" opacity="0.18"/>
    </pattern>

    <radialGradient id="recordShine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a233c"/>
      <stop offset="40%" stop-color="#110d18"/>
      <stop offset="70%" stop-color="#221b30"/>
      <stop offset="100%" stop-color="#09060d"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#vinylBg)"/>
  <rect width="800" height="500" fill="url(#purpleHalftoneVinyl)"/>

  <!-- Top Chrome Extension Status Bar -->
  <rect x="25" y="25" width="750" height="42" rx="8" fill="#1b1129" stroke="#6536D9" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="45" cy="46" r="6" fill="#1DB954"/>
  <text x="65" y="50" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#F5EBDD" letter-spacing="1">SPOTIFY VINTAGE VINYL PLAYER // CHROME EXTENSION MANIFEST V3</text>
  
  <rect x="535" y="34" width="115" height="24" rx="4" fill="#1DB954" fill-opacity="0.2" stroke="#1DB954" stroke-width="1"/>
  <text x="546" y="50" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#1DB954">STATUS: PLAYING</text>

  <rect x="660" y="34" width="100" height="24" rx="4" fill="#6536D9" fill-opacity="0.3" stroke="#6536D9" stroke-width="1"/>
  <text x="676" y="50" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#20C9E8">SPEED: 33 RPM</text>

  <!-- Left: Turntable Deck & Spinning Vinyl Disc -->
  <g transform="translate(40, 95)">
    <rect width="440" height="330" rx="12" fill="#150e24" stroke="#49352B" stroke-width="2"/>
    
    <!-- Turntable Platter Plinth -->
    <rect x="25" y="25" width="280" height="280" rx="140" fill="#0d0917" stroke="#33244d" stroke-width="4"/>

    <!-- Vinyl Grooves Circles -->
    <circle cx="165" cy="165" r="130" fill="url(#recordShine)" stroke="#221b33" stroke-width="1.5"/>
    <circle cx="165" cy="165" r="115" fill="none" stroke="#2c2242" stroke-width="1" stroke-dasharray="8 3"/>
    <circle cx="165" cy="165" r="100" fill="none" stroke="#251c38" stroke-width="1"/>
    <circle cx="165" cy="165" r="85" fill="none" stroke="#2c2242" stroke-width="1" stroke-dasharray="12 4"/>
    <circle cx="165" cy="165" r="70" fill="none" stroke="#251c38" stroke-width="1"/>

    <!-- Vinyl Center Label Sticker -->
    <circle cx="165" cy="165" r="48" fill="#F42B70" stroke="#FFD600" stroke-width="2"/>
    <circle cx="165" cy="165" r="12" fill="#FFD600" stroke="#000000" stroke-width="1.5"/>
    <circle cx="165" cy="165" r="4" fill="#000000"/>
    <text x="165" y="145" font-family="'Arial Black', sans-serif" font-size="7" fill="#FFFFFF" text-anchor="middle">RESHHH RECORDS</text>
    <text x="165" y="190" font-family="'Courier New', monospace" font-size="6" font-weight="bold" fill="#F5EBDD" text-anchor="middle">SIDE A • STEREO</text>

    <!-- Tonearm Pivot & Needle -->
    <circle cx="370" cy="65" r="22" fill="#2d1f45" stroke="#6536D9" stroke-width="2"/>
    <circle cx="370" cy="65" r="10" fill="#FFD600"/>
    <!-- Tonearm Rod curving down to record groove -->
    <path d="M 370 65 L 340 130 L 260 175" fill="none" stroke="#FFD600" stroke-width="4" stroke-linecap="round"/>
    <!-- Cartridge headshell -->
    <rect x="245" y="170" width="22" height="12" rx="2" fill="#F42B70" transform="rotate(-25 256 176)"/>
    <circle cx="248" cy="180" r="2.5" fill="#20C9E8"/>

    <!-- Bottom Audio HUD -->
    <rect x="315" y="225" width="110" height="80" rx="8" fill="#0d0818" stroke="#6536D9" stroke-width="1"/>
    <text x="325" y="245" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#20C9E8">AUDIO ENGINE</text>
    <text x="325" y="263" font-family="'Courier New', monospace" font-size="8" fill="#F5EBDD">CRACKLE: 42%</text>
    <text x="325" y="278" font-family="'Courier New', monospace" font-size="8" fill="#1DB954">PITCH: 1.00x</text>
    <text x="325" y="295" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="#FFD600">ANALOG WARMTH</text>
  </g>

  <!-- Right: Spotify Extension Controls & Real-time Visualizer -->
  <g transform="translate(505, 95)">
    <rect width="255" height="330" rx="12" fill="#180f26" stroke="#6536D9" stroke-width="1.5" stroke-opacity="0.5"/>
    
    <text x="20" y="32" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#1DB954">SPOTIFY WEB HOOK</text>

    <!-- Track metadata card -->
    <rect x="15" y="50" width="225" height="85" rx="8" fill="#0e0817" stroke="#1DB954" stroke-width="1"/>
    <rect x="25" y="62" width="60" height="60" rx="6" fill="#F42B70"/>
    <text x="55" y="98" font-family="'Arial Black', sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">♫</text>
    <text x="95" y="78" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#F5EBDD">Spider-Man: Across</text>
    <text x="95" y="94" font-family="'Courier New', monospace" font-size="9" fill="#1DB954">Metro Boomin</text>
    <text x="95" y="112" font-family="'Courier New', monospace" font-size="8" fill="#20C9E8">PALETTE: #F42B70</text>

    <!-- Analog Frequency Spectrum -->
    <rect x="15" y="145" width="225" height="85" rx="8" fill="#0e0817" stroke="#6536D9" stroke-width="1"/>
    <text x="25" y="165" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#FFD600">SURFACE ACOUSTIC SPECTRUM</text>
    <!-- Waveform bars -->
    <g transform="translate(25, 175)">
      <rect x="0" y="20" width="8" height="20" fill="#6536D9" rx="2"/>
      <rect x="12" y="10" width="8" height="30" fill="#F42B70" rx="2"/>
      <rect x="24" y="5" width="8" height="35" fill="#20C9E8" rx="2"/>
      <rect x="36" y="15" width="8" height="25" fill="#FFD600" rx="2"/>
      <rect x="48" y="2" width="8" height="38" fill="#1DB954" rx="2"/>
      <rect x="60" y="8" width="8" height="32" fill="#F42B70" rx="2"/>
      <rect x="72" y="18" width="8" height="22" fill="#6536D9" rx="2"/>
      <rect x="84" y="4" width="8" height="36" fill="#20C9E8" rx="2"/>
      <rect x="96" y="12" width="8" height="28" fill="#FFD600" rx="2"/>
      <rect x="108" y="22" width="8" height="18" fill="#1DB954" rx="2"/>
      <rect x="120" y="7" width="8" height="33" fill="#F42B70" rx="2"/>
      <rect x="132" y="14" width="8" height="26" fill="#6536D9" rx="2"/>
      <rect x="144" y="25" width="8" height="15" fill="#20C9E8" rx="2"/>
      <rect x="156" y="10" width="8" height="30" fill="#FFD600" rx="2"/>
      <rect x="168" y="19" width="8" height="21" fill="#1DB954" rx="2"/>
      <rect x="180" y="28" width="8" height="12" fill="#6536D9" rx="2"/>
    </g>

    <!-- Chrome Web Store Badge -->
    <rect x="15" y="245" width="225" height="40" rx="6" fill="#6536D9"/>
    <text x="127" y="270" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OPEN IN EXTENSION POPUP</text>

    <text x="20" y="310" font-family="'Courier New', monospace" font-size="9" fill="#F5EBDD" opacity="0.6">MANIFEST V3 • CONTENT SCRIPTS • CSS 3D</text>
  </g>
</svg>

