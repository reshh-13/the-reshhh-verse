<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1218"/>
      <stop offset="100%" stop-color="#12202a"/>
    </linearGradient>

    <pattern id="cyanHalftoneGame" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="#20C9E8" opacity="0.18"/>
    </pattern>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#gameBg)"/>
  <rect width="800" height="500" fill="url(#cyanHalftoneGame)"/>

  <!-- Top Unity Engine Status Bar -->
  <rect x="25" y="25" width="750" height="42" rx="8" fill="#0d1b24" stroke="#20C9E8" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="45" cy="46" r="6" fill="#20C9E8"/>
  <text x="65" y="50" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#F5EBDD" letter-spacing="1">SHAPESHIFT // UNITY 3D PHYSICS PLATFORMER</text>
  
  <rect x="535" y="34" width="115" height="24" rx="4" fill="#20C9E8" fill-opacity="0.2" stroke="#20C9E8" stroke-width="1"/>
  <text x="548" y="50" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#20C9E8">ENGINE: UNITY 2023</text>

  <rect x="660" y="34" width="100" height="24" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
  <text x="674" y="50" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#10B981">FPS: 60 FIXED</text>

  <!-- Left: Gameplay Level Viewport -->
  <g transform="translate(40, 95)">
    <rect width="440" height="330" rx="12" fill="#09141b" stroke="#20C9E8" stroke-width="1.5"/>

    <!-- Grid / Horizon Floor -->
    <line x1="20" y1="260" x2="420" y2="260" stroke="#20C9E8" stroke-width="3"/>
    <!-- Floor tiles -->
    <path d="M 20 260 L 60 310 M 100 260 L 140 310 M 180 260 L 210 310 M 260 260 L 280 310 M 340 260 L 350 310 M 420 260 L 410 310" stroke="#20C9E8" stroke-width="1" opacity="0.3"/>
    <line x1="10" y1="310" x2="430" y2="310" stroke="#20C9E8" stroke-width="1" opacity="0.4"/>

    <!-- Moving Platform floating -->
    <rect x="180" y="160" width="120" height="16" rx="4" fill="#1b303d" stroke="#FFD600" stroke-width="2"/>
    <text x="240" y="172" font-family="'Courier New', monospace" font-size="8" fill="#FFD600" text-anchor="middle">PRESSURE PLATE</text>

    <!-- Laser Barrier Obstacle -->
    <line x1="360" y1="90" x2="360" y2="260" stroke="#EF4444" stroke-width="3" filter="url(#neonGlow)"/>
    <circle cx="360" cy="90" r="5" fill="#EF4444"/>
    <circle cx="360" cy="260" r="5" fill="#EF4444"/>

    <!-- Player Character Morphing Sequence (Sphere -> Cube -> Triangle) -->
    <!-- Form 1: Sphere (Rolling) -->
    <g transform="translate(65, 230)">
      <circle cx="0" cy="0" r="22" fill="#20C9E8" stroke="#FFFFFF" stroke-width="2" filter="url(#neonGlow)"/>
      <path d="M -15 -10 Q 0 0, 15 -10" fill="none" stroke="#000000" stroke-width="2"/>
      <circle cx="-6" cy="-8" r="3" fill="#000000"/>
      <circle cx="6" cy="-8" r="3" fill="#000000"/>
      <text x="0" y="24" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="#20C9E8" text-anchor="middle">SPHERE // SPEED</text>
    </g>

    <path d="M 100 220 L 130 200" fill="none" stroke="#F42B70" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Form 2: Cube (Heavy / Mid-Air Smash on platform) -->
    <g transform="translate(240, 130)">
      <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#F42B70" stroke="#FFFFFF" stroke-width="2" filter="url(#neonGlow)"/>
      <text x="0" y="5" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">■</text>
      <!-- Downward smash vector -->
      <line x1="0" y1="20" x2="0" y2="34" stroke="#FFD600" stroke-width="2.5"/>
      <polygon points="0,38 -4,32 4,32" fill="#FFD600"/>
      <text x="0" y="-24" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="#F42B70" text-anchor="middle">CUBE // MASS 50KG</text>
    </g>

    <!-- Goal Portal -->
    <ellipse cx="400" cy="220" rx="16" ry="32" fill="none" stroke="#FFD600" stroke-width="3" filter="url(#neonGlow)"/>
    <ellipse cx="400" cy="220" rx="8" ry="20" fill="#6536D9" opacity="0.6"/>

    <!-- Bottom HUD stats -->
    <rect x="15" y="275" width="410" height="42" rx="8" fill="#060e13" stroke="#20C9E8" stroke-width="1"/>
    <text x="28" y="301" font-family="'Arial Black', Impact, sans-serif" font-size="13" fill="#20C9E8">FORM: [1: SPHERE]  [2: CUBE]  [3: PRISM]  •  LEVEL: 04</text>
  </g>

  <!-- Right: Unity Physics Inspector & C# Script Telemetry -->
  <g transform="translate(505, 95)">
    <rect width="255" height="330" rx="12" fill="#0d1b22" stroke="#20C9E8" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <text x="20" y="32" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#20C9E8">RIGIDBODY DYNAMICS</text>

    <!-- Physics State Inspector -->
    <rect x="15" y="50" width="225" height="115" rx="8" fill="#071217" stroke="#6536D9" stroke-width="1"/>
    <text x="25" y="70" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FFD600">STATE: FORM_SPHERE</text>
    <text x="25" y="88" font-family="'Courier New', monospace" font-size="9" fill="#F5EBDD">MASS: 1.0f • DRAG: 0.05f</text>
    <text x="25" y="104" font-family="'Courier New', monospace" font-size="9" fill="#F5EBDD">BOUNCE MATERIAL: 0.82</text>
    <text x="25" y="120" font-family="'Courier New', monospace" font-size="9" fill="#F5EBDD">VELOCITY: [12.4, -4.2] M/S</text>
    <text x="25" y="142" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#10B981">COLLIDER: SPHERE_2D [ACTIVE]</text>

    <!-- C# Script Status -->
    <rect x="15" y="175" width="225" height="90" rx="8" fill="#071217" stroke="#F42B70" stroke-width="1"/>
    <text x="25" y="195" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#F42B70">C# CONTROLLER HOOK</text>
    <text x="25" y="213" font-family="'Courier New', monospace" font-size="8" fill="#F5EBDD">// PlayerMorphController.cs</text>
    <text x="25" y="228" font-family="'Courier New', monospace" font-size="8" fill="#20C9E8">void SwitchShape(Shape target) {</text>
    <text x="35" y="242" font-family="'Courier New', monospace" font-size="8" fill="#F5EBDD">  ApplyMeshAndPhysics(target);</text>
    <text x="25" y="255" font-family="'Courier New', monospace" font-size="8" fill="#20C9E8">}</text>

    <!-- Controls tip -->
    <rect x="15" y="275" width="225" height="42" rx="6" fill="#20C9E8"/>
    <text x="127" y="300" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">PLAYABLE DEMO BUILD</text>
  </g>
</svg>

