<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1118"/>
      <stop offset="100%" stop-color="#141f2b"/>
    </linearGradient>

    <!-- Halftone pattern -->
    <pattern id="cyanHalftone" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="#20C9E8" opacity="0.18"/>
    </pattern>

    <!-- Grid lines -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#20C9E8" stroke-width="0.5" opacity="0.12"/>
    </pattern>

    <!-- Cyan glow filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#gridPattern)"/>
  <rect width="800" height="500" fill="url(#cyanHalftone)"/>

  <!-- Top Camera Status Bar -->
  <rect x="25" y="25" width="750" height="42" rx="8" fill="#0d1822" stroke="#20C9E8" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="45" cy="46" r="5" fill="#EF4444"/>
  <circle cx="45" cy="46" r="8" fill="none" stroke="#EF4444" opacity="0.6">
    <animate attributeName="r" values="6;11;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="65" y="50" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#20C9E8" letter-spacing="1">LIVE STREAM // CAM-01 // 60 FPS</text>
  <rect x="580" y="34" width="85" height="24" rx="4" fill="#20C9E8" fill-opacity="0.15" stroke="#20C9E8" stroke-width="1"/>
  <text x="590" y="50" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#20C9E8">CONF: 98.4%</text>
  <rect x="675" y="34" width="85" height="24" rx="4" fill="#F42B70" fill-opacity="0.15" stroke="#F42B70" stroke-width="1"/>
  <text x="686" y="50" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#F42B70">ASL v2.4</text>

  <!-- Viewport Reticle / Frame Corners -->
  <path d="M 40 95 L 40 80 L 55 80" fill="none" stroke="#20C9E8" stroke-width="2.5"/>
  <path d="M 760 95 L 760 80 L 745 80" fill="none" stroke="#20C9E8" stroke-width="2.5"/>
  <path d="M 40 435 L 40 450 L 55 450" fill="none" stroke="#20C9E8" stroke-width="2.5"/>
  <path d="M 760 435 L 760 450 L 745 450" fill="none" stroke="#20C9E8" stroke-width="2.5"/>

  <!-- Hand Tracking Box Area (Left/Center) -->
  <rect x="70" y="100" width="380" height="320" rx="12" fill="#0b151f" stroke="#20C9E8" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="85" y="125" font-family="'Courier New', monospace" font-size="11" fill="#20C9E8" opacity="0.8">LANDMARK ENGINE: 21-PT 3D SKELETON</text>

  <!-- 21 Landmark Nodes & Skeleton Connections -->
  <g filter="url(#cyanGlow)">
    <!-- Wrist -->
    <circle cx="260" cy="360" r="6" fill="#20C9E8"/>
    <!-- Thumb joints -->
    <line x1="260" y1="360" x2="210" y2="330" stroke="#20C9E8" stroke-width="2.5"/>
    <line x1="210" y1="330" x2="180" y2="280" stroke="#20C9E8" stroke-width="2.5"/>
    <line x1="180" y1="280" x2="165" y2="240" stroke="#20C9E8" stroke-width="2.5"/>
    <circle cx="210" cy="330" r="4.5" fill="#20C9E8"/>
    <circle cx="180" cy="280" r="4.5" fill="#20C9E8"/>
    <circle cx="165" cy="240" r="5" fill="#FFD600"/>

    <!-- Index finger joints -->
    <line x1="260" y1="360" x2="230" y2="270" stroke="#20C9E8" stroke-width="2.5"/>
    <line x1="230" y1="270" x2="220" y2="210" stroke="#20C9E8" stroke-width="2.5"/>
    <line x1="220" y1="210" x2="215" y2="160" stroke="#20C9E8" stroke-width="2.5"/>
    <line x1="215" y1="160" x2="210" y2="130" stroke="#20C9E8" stroke-width="2.5"/>
    <circle cx="230" cy="270" r="4.5" fill="#20C9E8"/>
    <circle cx="220" cy="210" r="4.5" fill="#20C9E8"/>
    <circle cx="215" cy="160" r="4.5" fill="#20C9E8"/>
    <circle cx="210" cy="130" r="5.5" fill="#F42B70"/>

    <!-- Middle finger joints -->
    <line x1="260" y1="360" x2="270" y2="260" stroke="#20C9E8" stroke-width="2.5"/>
    <line x1="270" y1="260" x2="275" y2="200" stroke="#20C9E8" stroke-width="2.5"/>
    <line x1="275" y1="200" x2="280" y2="150" stroke="#20C9E8" stroke-width="2.5"/>
    <line x1="280" y1="150" x2="282" y2="120" stroke="#20C9E8" stroke-width="2.5"/>
    <circle cx="270" cy="260" r="4.5" fill="#20C9E8"/>
    <circle cx="275" cy="200" r="4.5" fill="#20C9E8"/>
    <circle cx="280" cy="150" r="4.5" fill="#20C9E8"/>
    <circle cx="282" cy="120" r="5.5" fill="#F42B70"/>

    <!-- Ring finger joints -->
    <line x1="260" y1="360" x2="310" y2="275" stroke="#20C9E8" stroke-width="2.5"/>
    <line x1="310" y1="275" x2="325" y2="225" stroke="#20C9E8" stroke-width="2.5"/>
    <line x1="325" y1="225" x2="335" y2="185" stroke="#20C9E8" stroke-width="2.5"/>
    <line x1="335" y1="185" x2="340" y2="155" stroke="#20C9E8" stroke-width="2.5"/>
    <circle cx="310" cy="275" r="4.5" fill="#20C9E8"/>
    <circle cx="325" cy="225" r="4.5" fill="#20C9E8"/>
    <circle cx="335" cy="185" r="4.5" fill="#20C9E8"/>
    <circle cx="340" cy="155" r="5" fill="#FFD600"/>

    <!-- Pinky joints -->
    <line x1="260" y1="360" x2="345" y2="305" stroke="#20C9E8" stroke-width="2.5"/>
    <line x1="345" y1="305" x2="370" y2="265" stroke="#20C9E8" stroke-width="2.5"/>
    <line x1="370" y1="265" x2="385" y2="235" stroke="#20C9E8" stroke-width="2.5"/>
    <line x1="385" y1="235" x2="395" y2="210" stroke="#20C9E8" stroke-width="2.5"/>
    <circle cx="345" cy="305" r="4.5" fill="#20C9E8"/>
    <circle cx="370" cy="265" r="4.5" fill="#20C9E8"/>
    <circle cx="385" cy="235" r="4.5" fill="#20C9E8"/>
    <circle cx="395" cy="210" r="5" fill="#FFD600"/>
  </g>

  <!-- Real-time Recognition Banner Inside Video -->
  <rect x="95" y="365" width="330" height="42" rx="8" fill="#000000" fill-opacity="0.85" stroke="#FFD600" stroke-width="1.5"/>
  <text x="110" y="391" font-family="'Arial Black', Impact, sans-serif" font-size="16" fill="#FFD600" letter-spacing="1">GESTURE: "HELLO / GREETINGS"</text>

  <!-- Right Side Analytics Panel -->
  <rect x="475" y="100" width="300" height="320" rx="12" fill="#0d1924" stroke="#20C9E8" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <text x="495" y="130" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#20C9E8">NEURAL CLASSIFIER PROBABILITIES</text>
  
  <!-- Class 1 -->
  <text x="495" y="160" font-family="'Courier New', monospace" font-size="11" fill="#F5EBDD">01. HELLO</text>
  <text x="735" y="160" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#20C9E8" text-anchor="end">98.4%</text>
  <rect x="495" y="170" width="260" height="8" rx="4" fill="#142634"/>
  <rect x="495" y="170" width="255" height="8" rx="4" fill="#20C9E8"/>

  <!-- Class 2 -->
  <text x="495" y="205" font-family="'Courier New', monospace" font-size="11" fill="#F5EBDD">02. THANK YOU</text>
  <text x="735" y="205" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#F5EBDD" opacity="0.6" text-anchor="end">1.1%</text>
  <rect x="495" y="215" width="260" height="8" rx="4" fill="#142634"/>
  <rect x="495" y="215" width="10" height="8" rx="4" fill="#6536D9"/>

  <!-- Class 3 -->
  <text x="495" y="250" font-family="'Courier New', monospace" font-size="11" fill="#F5EBDD">03. WELCOME</text>
  <text x="735" y="250" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#F5EBDD" opacity="0.6" text-anchor="end">0.5%</text>
  <rect x="495" y="260" width="260" height="8" rx="4" fill="#142634"/>
  <rect x="495" y="260" width="6" height="8" rx="4" fill="#6536D9"/>

  <!-- TTS Waveform Box -->
  <rect x="495" y="290" width="260" height="65" rx="8" fill="#081017" stroke="#6536D9" stroke-width="1"/>
  <text x="508" y="310" font-family="'Courier New', monospace" font-size="10" fill="#F42B70" font-weight="bold">SYNTHESIZED SPEECH OUTPUT</text>
  <!-- Soundwave -->
  <path d="M 510 335 Q 520 315, 530 335 T 550 335 T 570 315 T 590 350 T 610 325 T 630 340 T 650 320 T 670 335 T 690 330 T 710 335 T 730 335" fill="none" stroke="#F42B70" stroke-width="2"/>
  
  <text x="495" y="380" font-family="'Courier New', monospace" font-size="10" fill="#20C9E8" opacity="0.7">LATENCY: 18ms // PIPELINE: REALTIME</text>
  <rect x="495" y="390" width="260" height="20" rx="4" fill="#20C9E8" fill-opacity="0.1"/>
  <text x="505" y="404" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#20C9E8">WEBSOCKET STATUS: CONNECTED (PORT 8000)</text>
</svg>

