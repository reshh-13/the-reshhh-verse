<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hostelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f0c"/>
      <stop offset="100%" stop-color="#261b15"/>
    </linearGradient>

    <pattern id="coffeeHalftone" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="#A47758" opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#hostelBg)"/>
  <rect width="800" height="500" fill="url(#coffeeHalftone)"/>

  <!-- Top Campus Portal Header -->
  <rect x="25" y="25" width="750" height="42" rx="8" fill="#1f140f" stroke="#A47758" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="45" cy="46" r="6" fill="#F59E0B"/>
  <text x="65" y="50" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#F5EBDD" letter-spacing="1">HOSTEL GRIEVANCE HUB // INCIDENT ESCALATION CONSOLE</text>
  
  <rect x="525" y="34" width="120" height="24" rx="4" fill="#A47758" fill-opacity="0.25" stroke="#A47758" stroke-width="1"/>
  <text x="537" y="50" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#F5EBDD">ROLE: WARDEN ADMIN</text>

  <rect x="655" y="34" width="105" height="24" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
  <text x="668" y="50" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#10B981">SLA: 98.2% ON-TIME</text>

  <!-- Left: Incident Ticket Lifecycle & Detailed Dossier -->
  <g transform="translate(40, 95)">
    <rect width="440" height="330" rx="12" fill="#19110c" stroke="#49352B" stroke-width="1.5"/>

    <!-- Pipeline Stages Header -->
    <rect x="15" y="15" width="410" height="48" rx="8" fill="#0f0906"/>
    <g transform="translate(25, 27)">
      <!-- Step 1 -->
      <circle cx="20" cy="12" r="10" fill="#10B981"/>
      <text x="20" y="16" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">✓</text>
      <text x="40" y="16" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#10B981">REPORTED</text>
      
      <line x1="100" y1="12" x2="125" y2="12" stroke="#10B981" stroke-width="2"/>

      <!-- Step 2 -->
      <circle cx="140" cy="12" r="10" fill="#10B981"/>
      <text x="140" y="16" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">✓</text>
      <text x="160" y="16" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#10B981">ASSIGNED</text>

      <line x1="220" y1="12" x2="245" y2="12" stroke="#FFD600" stroke-width="2"/>

      <!-- Step 3 (Current) -->
      <circle cx="260" cy="12" r="10" fill="#FFD600"/>
      <text x="260" y="16" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">●</text>
      <text x="280" y="16" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#FFD600">IN-PROGRESS</text>

      <line x1="345" y1="12" x2="365" y2="12" stroke="#49352B" stroke-width="2"/>

      <!-- Step 4 -->
      <circle cx="380" cy="12" r="10" fill="#2d1c14"/>
      <text x="380" y="16" font-family="'Courier New', monospace" font-size="9" fill="#A47758" text-anchor="middle">4</text>
    </g>

    <!-- Ticket Detail Card -->
    <rect x="15" y="75" width="410" height="235" rx="8" fill="#120b08" stroke="#A47758" stroke-width="1"/>
    
    <text x="30" y="105" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#F5EBDD">TICKET #409: ELECTRICAL POWER GRID FAILURE</text>
    <rect x="30" y="115" width="90" height="20" rx="4" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1"/>
    <text x="37" y="129" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#EF4444">PRIORITY: HIGH</text>

    <text x="135" y="129" font-family="'Courier New', monospace" font-size="10" fill="#A47758">BLOCK C • 3RD FLOOR • ROOM 304</text>

    <text x="30" y="160" font-family="'Courier New', monospace" font-size="10" fill="#F5EBDD" opacity="0.8">LODGED BY: Reshma S (Dept of CSE) at 09:15 AM</text>
    <text x="30" y="180" font-family="'Courier New', monospace" font-size="10" fill="#F5EBDD" opacity="0.8">INCIDENT: Short circuit tripping main room MCB breaker switch</text>

    <!-- Evidence attachment box -->
    <rect x="30" y="200" width="180" height="95" rx="6" fill="#1a100b" stroke="#49352B" stroke-width="1"/>
    <text x="40" y="220" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#A47758">ATTACHED EVIDENCE (JPG)</text>
    <!-- Circuit diagram / electrical box sketch -->
    <rect x="40" y="230" width="160" height="55" rx="4" fill="#0d0806"/>
    <line x1="50" y1="258" x2="90" y2="258" stroke="#FFD600" stroke-width="2"/>
    <rect x="90" y="248" width="20" height="20" fill="#EF4444"/>
    <line x1="110" y1="258" x2="150" y2="258" stroke="#FFD600" stroke-width="2"/>
    <text x="115" y="278" font-family="'Courier New', monospace" font-size="8" fill="#10B981">MCB-TRIP</text>

    <!-- Assigned Crew -->
    <rect x="225" y="200" width="185" height="95" rx="6" fill="#1a100b" stroke="#49352B" stroke-width="1"/>
    <text x="235" y="220" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#A47758">DISPATCHED CREW</text>
    <text x="235" y="240" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#F5EBDD">K. Murugan (Electrician)</text>
    <text x="235" y="258" font-family="'Courier New', monospace" font-size="9" fill="#10B981">OTP VERIFIED // ON SITE</text>
    <text x="235" y="278" font-family="'Courier New', monospace" font-size="9" fill="#FFD600">SLA REMAINING: 01h 45m</text>
  </g>

  <!-- Right: Escalation Matrix & Analytics -->
  <g transform="translate(505, 95)">
    <rect width="255" height="330" rx="12" fill="#19110c" stroke="#A47758" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <text x="20" y="32" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#A47758">AUTOMATED SLA ESCALATION</text>

    <!-- Tier 1 -->
    <rect x="15" y="48" width="225" height="50" rx="6" fill="#0f0906" stroke="#10B981" stroke-width="1"/>
    <text x="25" y="68" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#10B981">TIER 1: CREW DISPATCH</text>
    <text x="25" y="86" font-family="'Courier New', monospace" font-size="9" fill="#F5EBDD">0 - 2 Hours • Assigned automatically</text>

    <!-- Tier 2 -->
    <rect x="15" y="108" width="225" height="50" rx="6" fill="#0f0906" stroke="#FFD600" stroke-width="1"/>
    <text x="25" y="128" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FFD600">TIER 2: FLOOR WARDEN</text>
    <text x="25" y="146" font-family="'Courier New', monospace" font-size="9" fill="#F5EBDD">2 - 6 Hours • SMS / Portal Alert</text>

    <!-- Tier 3 -->
    <rect x="15" y="168" width="225" height="50" rx="6" fill="#0f0906" stroke="#EF4444" stroke-width="1"/>
    <text x="25" y="188" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#EF4444">TIER 3: CHIEF WARDEN</text>
    <text x="25" y="206" font-family="'Courier New', monospace" font-size="9" fill="#F5EBDD">> 6 Hours • Emergency Escalation</text>

    <!-- Facility health metrics -->
    <rect x="15" y="230" width="225" height="85" rx="6" fill="#0f0906"/>
    <text x="25" y="250" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#A47758">CAMPUS METRICS (THIS MONTH)</text>
    <text x="25" y="270" font-family="'Courier New', monospace" font-size="9" fill="#F5EBDD">TOTAL RESOLVED: 418 TICKETS</text>
    <text x="25" y="288" font-family="'Courier New', monospace" font-size="9" fill="#10B981">AVERAGE RESOLUTION: 3.2 HOURS</text>
    <text x="25" y="304" font-family="'Courier New', monospace" font-size="9" fill="#20C9E8">RECURRING HOTSPOTS: 0 (OPTIMAL)</text>
  </g>
</svg>

