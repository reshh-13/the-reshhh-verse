<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="agriBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a170d"/>
      <stop offset="100%" stop-color="#162919"/>
    </linearGradient>

    <pattern id="yellowHalftone" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="#FFD600" opacity="0.16"/>
    </pattern>

    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#agriBg)"/>
  <rect width="800" height="500" fill="url(#yellowHalftone)"/>

  <!-- Top Agri Status Header -->
  <rect x="25" y="25" width="750" height="42" rx="8" fill="#112213" stroke="#FFD600" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="45" cy="46" r="6" fill="#10B981"/>
  <text x="65" y="50" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#F5EBDD" letter-spacing="1">ANNADATHA AI // SMART AGRONOMIST SCANNER</text>
  
  <rect x="520" y="34" width="125" height="24" rx="4" fill="#FFD600" fill-opacity="0.2" stroke="#FFD600" stroke-width="1"/>
  <text x="532" y="50" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FFD600">MODEL: CNN-MOBILENET</text>

  <rect x="655" y="34" width="105" height="24" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
  <text x="668" y="50" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#10B981">DEVICE: MOBILE WEB</text>

  <!-- Left: Leaf Pathology Inspection Screen -->
  <g transform="translate(40, 95)">
    <rect width="440" height="330" rx="12" fill="#0d1b10" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Leaf Silhouette & Anatomy -->
    <path d="M 80 280 C 100 240, 120 180, 200 100 C 280 180, 320 220, 360 250 C 310 270, 220 290, 80 280 Z" fill="#2d6a38" stroke="#1b4d24" stroke-width="3"/>
    <!-- Leaf veins -->
    <path d="M 80 280 Q 180 200, 200 100" fill="none" stroke="#489d58" stroke-width="2.5"/>
    <path d="M 140 225 Q 180 215, 240 210" fill="none" stroke="#489d58" stroke-width="1.5"/>
    <path d="M 170 180 Q 210 165, 270 155" fill="none" stroke="#489d58" stroke-width="1.5"/>
    <path d="M 120 255 Q 140 240, 180 250" fill="none" stroke="#489d58" stroke-width="1.5"/>

    <!-- Disease Lesions (Bacterial Blight Spots) -->
    <ellipse cx="230" cy="170" rx="14" ry="10" fill="#6d4c20" stroke="#FFD600" stroke-width="1"/>
    <ellipse cx="165" cy="215" rx="18" ry="12" fill="#583c16" stroke="#FFD600" stroke-width="1"/>
    <ellipse cx="280" cy="210" rx="12" ry="8" fill="#6d4c20" stroke="#FFD600" stroke-width="1"/>

    <!-- AI Bounding Boxes Around Lesions -->
    <rect x="140" y="195" width="55" height="42" rx="4" fill="none" stroke="#FFD600" stroke-width="2" stroke-dasharray="3 3" filter="url(#yellowGlow)"/>
    <rect x="140" y="180" width="85" height="15" rx="3" fill="#FFD600"/>
    <text x="144" y="191" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#000000">LESION: 96.2%</text>

    <rect x="210" y="150" width="50" height="38" rx="4" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="210" y="136" width="80" height="15" rx="3" fill="#EF4444"/>
    <text x="214" y="147" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#FFFFFF">BLIGHT: 94.1%</text>

    <!-- Bottom Diagnosis Banner -->
    <rect x="15" y="275" width="410" height="42" rx="8" fill="#071009" stroke="#FFD600" stroke-width="1"/>
    <text x="30" y="301" font-family="'Arial Black', Impact, sans-serif" font-size="14" fill="#FFD600" letter-spacing="0.5">DIAGNOSIS: EARLY BACTERIAL SPOT (STAGE 1)</text>
  </g>

  <!-- Right: Farm Advisory & Weather Panel -->
  <g transform="translate(505, 95)">
    <rect width="255" height="330" rx="12" fill="#102012" stroke="#FFD600" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <text x="20" y="32" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#FFD600">ACTIONABLE ADVISORY</text>

    <!-- Treatment recommendation box -->
    <rect x="15" y="50" width="225" height="115" rx="8" fill="#0a160c" stroke="#10B981" stroke-width="1"/>
    <text x="25" y="72" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#10B981">ORGANIC COUNTERMEASURE</text>
    <text x="25" y="92" font-family="'Courier New', monospace" font-size="9" fill="#F5EBDD">1. Dilute Neem Seed Extract 5%</text>
    <text x="25" y="108" font-family="'Courier New', monospace" font-size="9" fill="#F5EBDD">2. Spray foliar mist before dawn</text>
    <text x="25" y="124" font-family="'Courier New', monospace" font-size="9" fill="#F5EBDD">3. Copper hydroxide spray 2g/L</text>
    <text x="25" y="145" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#FFD600">RECOVERY ESTIMATE: 6 DAYS</text>

    <!-- Weather & Microclimate alert -->
    <rect x="15" y="180" width="225" height="95" rx="8" fill="#0a160c" stroke="#20C9E8" stroke-width="1"/>
    <text x="25" y="202" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#20C9E8">MICROCLIMATE SENSORS</text>
    <text x="25" y="222" font-family="'Courier New', monospace" font-size="9" fill="#F5EBDD">HUMIDITY: 78% (HIGH ROT RISK)</text>
    <text x="25" y="238" font-family="'Courier New', monospace" font-size="9" fill="#F5EBDD">TEMP: 28.5°C // WIND: 8 KM/H</text>
    <text x="25" y="258" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#EF4444">RAIN FORECAST: IN 3.5 HOURS</text>

    <!-- Voice prompt bar -->
    <rect x="15" y="285" width="225" height="32" rx="6" fill="#FFD600"/>
    <text x="127" y="306" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">VOICE QUERY: TAMIL / ENGLISH</text>
  </g>
</svg>

